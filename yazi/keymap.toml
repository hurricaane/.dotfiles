#:schema https://yazi-rs.github.io/schemas/keymap.json

# Only additions and overrides live here: Yazi merges them on top of its built-in keymap.
# Defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml

[mgr]
prepend_keymap = [
	# Plugins
	{ on = "M",          run = "plugin mount",                    desc = "Mount menu" },
	{ on = [ "c", "m" ], run = "plugin chmod",                    desc = "Chmod on selected files" },
	{ on = "C",          run = "plugin ouch",                     desc = "Compress with ouch" },
	{ on = ";",          run = "plugin bunny",                    desc = "Bunny hops" },
	{ on = "'",          run = "plugin bunny fuzzy",              desc = "Bunny hops (fuzzy)" },
	{ on = "l",          run = "plugin smart-enter",              desc = "Enter the child directory, or open the file" },
	{ on = "p",          run = "plugin smart-paste",              desc = "Paste into the hovered directory or CWD" },
	{ on = "f",          run = "plugin jump-to-char",             desc = "Jump to char" },
	{ on = "T",          run = "plugin toggle-pane max-preview",  desc = "Maximize or restore the preview pane" },

	# Filter, moved from `f` (taken by jump-to-char)
	{ on = "F", run = "filter --smart", desc = "Filter files" },

	# Relative motions (5j, 3k…)
	{ on = "1", run = "plugin relative-motions 1", desc = "Move in relative steps" },
	{ on = "2", run = "plugin relative-motions 2", desc = "Move in relative steps" },
	{ on = "3", run = "plugin relative-motions 3", desc = "Move in relative steps" },
	{ on = "4", run = "plugin relative-motions 4", desc = "Move in relative steps" },
	{ on = "5", run = "plugin relative-motions 5", desc = "Move in relative steps" },
	{ on = "6", run = "plugin relative-motions 6", desc = "Move in relative steps" },
	{ on = "7", run = "plugin relative-motions 7", desc = "Move in relative steps" },
	{ on = "8", run = "plugin relative-motions 8", desc = "Move in relative steps" },
	{ on = "9", run = "plugin relative-motions 9", desc = "Move in relative steps" },

	# Tab switching, moved from 1-9 (taken by relative-motions); Alt-N is taken by tmux
	{ on = [ "t", "1" ], run = "tab_switch 0", desc = "Switch to first tab" },
	{ on = [ "t", "2" ], run = "tab_switch 1", desc = "Switch to second tab" },
	{ on = [ "t", "3" ], run = "tab_switch 2", desc = "Switch to third tab" },
	{ on = [ "t", "4" ], run = "tab_switch 3", desc = "Switch to fourth tab" },
	{ on = [ "t", "5" ], run = "tab_switch 4", desc = "Switch to fifth tab" },
	{ on = [ "t", "6" ], run = "tab_switch 5", desc = "Switch to sixth tab" },
	{ on = [ "t", "7" ], run = "tab_switch 6", desc = "Switch to seventh tab" },
	{ on = [ "t", "8" ], run = "tab_switch 7", desc = "Switch to eighth tab" },
	{ on = [ "t", "9" ], run = "tab_switch 8", desc = "Switch to ninth tab" },

	# Shell and git
	{ on = "!",          for = "unix", run = 'shell "$SHELL" --block', desc = "Open $SHELL here" },
	{ on = [ "g", "r" ], run = 'shell -- root="$(git rev-parse --show-toplevel 2>/dev/null)" && ya emit cd "$root"', desc = "Go to the git root" },

	# Yank, and copy the files as file:// URIs for GUI apps
	{ on = "y", run = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ], desc = "Yank (and copy as URIs)" },
]

[input]
prepend_keymap = [
	# Cancel directly instead of entering vi normal mode
	{ on = "<Esc>", run = "close", desc = "Cancel input" },
]
